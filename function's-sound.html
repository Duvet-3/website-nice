<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>函数声音实验室</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #142238;
  --line: #263852;
  --text: #e7f0fb;
  --muted: #8fa4bd;
  --cyan: #55d9ed;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(ellipse at 15% 0%, #142944, transparent 45%), var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, sans-serif;
}

main {
  max-width: 1180px;
  margin: auto;
  padding: 32px 22px 48px;
}

h1 { margin: 0 0 5px; font-size: 26px; }
h2 { font-size: 15px; margin: 0 0 14px; }
.sub, .hint, .note { color: var(--muted); font-size: 12px; }

.top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 22px;
}

.layout {
  display: grid;
  grid-template-columns: 1.65fr 0.85fr;
  gap: 16px;
}

.panel {
  background: linear-gradient(160deg, #142238, #101a2b);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 12px 35px #0002;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 7px;
  color: #b9c9dc;
}

input {
  width: 100%;
  background: #091525;
  color: var(--text);
  border: 1px solid #304762;
  border-radius: 8px;
  padding: 11px 12px;
  font: inherit;
  outline: none;
}

input:focus {
  border-color: var(--cyan);
}

.formula {
  font: 16px monospace;
}

.hint {
  margin-top: 8px;
  line-height: 1.7;
}

.graph-wrap {
  background: #091321;
  border: 1px solid #263b55;
  border-radius: 10px;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 380px;
  display: block;
}

.graph-foot {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
  margin-top: 9px;
}

.controls, .examples {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 13px;
}

button {
  background: #172b43;
  color: #e6f3ff;
  border: 1px solid #3b5877;
  padding: 9px 13px;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
}

button:hover { filter: brightness(1.2); }
button:disabled { opacity: .4; cursor: not-allowed; }

.primary {
  background: linear-gradient(135deg, #187d9b, #2869b8);
  border-color: #3cb9d1;
}

.chip {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 20px;
  background: #14263b;
  color: #b8d5ed;
}

.tab {
  font-size: 13px;
  background: #0d1b2d;
  color: #a9bfd5;
}

.tab.active {
  background: #17445a;
  border-color: var(--cyan);
  color: white;
}

.section-gap {
  height: 1px;
  background: var(--line);
  margin: 18px 0;
}

.readout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 14px;
}

.metric {
  background: #0b1727;
  border: 1px solid #203650;
  border-radius: 9px;
  padding: 10px;
}

.metric span {
  display: block;
  color: var(--muted);
  font-size: 11px;
}

.metric strong {
  font: 16px monospace;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  margin: 13px 0;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #71849a;
}

.dot.live {
  background: #56e0b1;
  box-shadow: 0 0 10px #56e0b1;
}

.console {
  background: #081321;
  border: 1px solid #203650;
  border-radius: 9px;
  min-height: 75px;
  padding: 11px;
  color: #a9c3dc;
  font: 12px/1.6 monospace;
  overflow-wrap: anywhere;
}

.console.error { color: #ff8c8c; }

.note {
  margin-top: 18px;
  line-height: 1.8;
}

@media(max-width:800px) {
  .layout { grid-template-columns: 1fr; }
  .top { flex-direction: column; }
  canvas { height: 300px; }
}
</style>
</head>

<body>
<main>

<header class="top">
  <div>
    <h1>函数声音实验室</h1>
    <div class="sub">
      用数学函数塑造声音 · 每个乐段由音调函数和音色函数共同定义
    </div>
  </div>
  <div class="sub">基础原型 03</div>
</header>

<div class="layout">

<!-- 函数显示区 -->
<section class="panel">

  <h2>函数显示区</h2>

  <div class="controls" style="margin:0 0 11px">
    <button id="pitchTab" class="tab active">
      音调函数 y=f(t)
    </button>

    <button id="timbreTab" class="tab">
      音色函数 y=g(φ)
    </button>
  </div>

  <div class="graph-wrap">
    <canvas id="plot"></canvas>
  </div>

  <div class="graph-foot">
    <span id="axisX">横轴：时间 t（秒）</span>
    <span id="axisY">纵轴：音高 y（半音）</span>
  </div>

  <div class="readout">
    <div class="metric">
      <span>当前时间</span>
      <strong id="timeRead">0.00 s</strong>
    </div>

    <div class="metric">
      <span>当前音高</span>
      <strong id="pitchRead">C4 · 0</strong>
    </div>
  </div>

  <div class="note" id="graphNote">
    音调函数的横轴范围为 0 至 T。
  </div>

</section>


<div class="side">

<!-- 函数输入区 -->
<section class="panel">

  <h2>函数输入区</h2>

  <label>音调函数 y=f(t)</label>

  <input
    id="pitchFormula"
    class="formula"
    value="12*sin(2*pi*t)"
    spellcheck="false"
  >

  <div class="hint">
    自变量为 t，单位为秒。函数值表示相对中央 C 的半音数。
    0=C4，12=C5，-12=C3。
  </div>

  <div class="examples">
    <button class="chip" data-target="pitch" data-f="t">y=t</button>
    <button class="chip" data-target="pitch" data-f="12*sin(2*pi*t)">正弦变化</button>
    <button class="chip" data-target="pitch" data-f="3*t">线性上行</button>
    <button class="chip" data-target="pitch" data-f="0">固定音高</button>
  </div>

  <div class="section-gap"></div>

  <label>音色函数 y=g(φ)</label>

  <input
    id="timbreFormula"
    class="formula"
    value="sin(phi)"
    spellcheck="false"
  >

  <div class="hint">
    自变量为 φ，表示声音振动的相位，单位为弧度。
    一个完整周期为 0 至 2π。
  </div>

  <div class="examples">
    <button class="chip" data-target="timbre" data-f="sin(phi)">
      正弦波
    </button>

    <button class="chip" data-target="timbre" data-f="sign(sin(phi))">
      方波
    </button>

    <button class="chip" data-target="timbre" data-f="(2/pi)*asin(sin(phi))">
      三角波
    </button>

    <button class="chip" data-target="timbre" data-f="2*(phi/(2*pi)-floor(phi/(2*pi)+0.5))">
      锯齿波
    </button>
  </div>

  <div class="hint">
    也可以自行组合函数，例如：
    <br>
    sin(phi)+0.3*sin(3*phi)
    <br>
    sin(phi)+0.5*sin(2*phi)
  </div>

  <div class="controls">
    <button id="apply" class="primary">
      应用两个函数
    </button>
  </div>

</section>


<!-- 控制台 -->
<section class="panel">

  <h2>控制台</h2>

  <label>乐段长度 T（秒）</label>

  <input
    id="duration"
    type="number"
    min="0.1"
    max="600"
    step="0.1"
    value="5"
  >

  <div class="controls">
    <button id="play" class="primary">▶ 播放</button>
    <button id="pause" disabled>Ⅱ 暂停</button>
    <button id="stop" disabled>■ 停止</button>
  </div>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">待机</span>
  </div>

  <div id="console" class="console">
    系统就绪。
  </div>

</section>

</div>
</div>
</main>


<script>
(() => {

const $ = id => document.getElementById(id);

const canvas = $("plot");
const ctx = canvas.getContext("2d");

const pitchInput = $("pitchFormula");
const timbreInput = $("timbreFormula");
const durationInput = $("duration");

const TAU = Math.PI * 2;

let pitchFn = t => 12 * Math.sin(TAU * t);
let timbreFn = phi => Math.sin(phi);

let T = 5;
let elapsed = 0;
let startAt = 0;

let audio = null;
let osc = null;
let gain = null;

let playing = false;
let raf = 0;

let activeGraph = "pitch";

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));


/* ==========================
   函数解析器
========================== */

function compileExpression(source, variable) {

  let s = source.trim()
    .replace(/^y\s*=\s*/i,"")
    .replace(/φ/g,"phi")
    .replace(/\^/g,"**");

  if (!s) {
    throw Error("请输入函数表达式。");
  }

  // 允许的数学函数
  const allowed = [
    "sin","cos","tan",
    "asin","acos","atan",
    "sqrt","abs","sign",
    "log","log10","exp",
    "floor","ceil","round",
    "min","max","pow"
  ];

  // 检查表达式中的变量和函数
  if (!/^[a-zA-Z0-9_\s+\-*/().,%*]+$/.test(s)) {
    throw Error("表达式包含不支持的字符。");
  }

  const identifiers = s.match(/[a-zA-Z_]\w*/g) || [];

  for (const name of identifiers) {

    if (
      name !== variable &&
      !allowed.includes(name) &&
      !["pi","PI","e","E"].includes(name)
    ) {
      throw Error(
        "未知变量或函数：" + name +
        "。当前自变量应为 " + variable + "。"
      );
    }
  }

  // 转换为 JavaScript Math 函数
  s = s.replace(
    /\b(sin|cos|tan|asin|acos|atan|sqrt|abs|sign|log|log10|exp|floor|ceil|round|min|max|pow)\s*\(/g,
    "Math.$1("
  );

  s = s.replace(
    /\b(pi|PI|e|E)\b/g,
    m => ({
      pi:"Math.PI",
      PI:"Math.PI",
      e:"Math.E",
      E:"Math.E"
    })[m]
  );

  let fn;

  try {
    fn = new Function(
      variable,
      '"use strict"; return (' + s + ');'
    );
  } catch(e) {
    throw Error("表达式无法解析：" + e.message);
  }

  try {
    const test = fn(0.37);

    if (typeof test !== "number") {
      throw Error("函数结果必须是数值。");
    }
  } catch(e) {
    throw Error("函数计算失败：" + e.message);
  }

  return fn;
}


function valueAt(fn,x) {
  try {
    const v = Number(fn(x));
    return Number.isFinite(v) ? v : NaN;
  } catch {
    return NaN;
  }
}


/* ==========================
   控制台信息
========================== */

function say(msg,error=false) {
  $("console").textContent = msg;
  $("console").classList.toggle("error",error);
}

function setState(msg,live=false) {
  $("state").textContent = msg;
  $("dot").classList.toggle("live",live);
}


/* ==========================
   函数图像绘制
========================== */

function resize() {

  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(r.width*dpr);
  canvas.height = Math.round(r.height*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);

  draw();
}


function draw() {

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  if (!w || !h) return;

  ctx.clearRect(0,0,w,h);

  const isPitch = activeGraph === "pitch";

  const end = isPitch ? T : TAU;

  const fn = isPitch ? pitchFn : timbreFn;

  const values = [];

  for (let i=0;i<=1200;i++) {

    const v = valueAt(fn,end*i/1200);

    if (Number.isFinite(v) && Math.abs(v)<1e8) {
      values.push(v);
    }
  }

  let ymin = values.length ? Math.min(...values) : -1;
  let ymax = values.length ? Math.max(...values) : 1;

  if (ymax-ymin < 1e-8) {
    ymin -= 1;
    ymax += 1;
  }

  const pad = {
    l:55,
    r:18,
    t:20,
    b:36
  };

  const pw = w-pad.l-pad.r;
  const ph = h-pad.t-pad.b;

  const margin = (ymax-ymin)*0.12 || 1;

  ymin -= margin;
  ymax += margin;

  const X = x => pad.l+x/end*pw;
  const Y = y => pad.t+(ymax-y)/(ymax-ymin)*ph;

  // 网格
  ctx.strokeStyle = "#1c3048";
  ctx.lineWidth = 1;
  ctx.fillStyle = "#8fa4bd";
  ctx.font = "11px system-ui";

  for (let i=0;i<=5;i++) {

    const x = pad.l+pw*i/5;
    const v = end*i/5;

    ctx.beginPath();
    ctx.moveTo(x,pad.t);
    ctx.lineTo(x,pad.t+ph);
    ctx.stroke();

    const label = isPitch
      ? v.toFixed(1)
      : (v/Math.PI).toFixed(1)+"π";

    ctx.fillText(label,x-12,h-12);
  }

  for (let i=0;i<=4;i++) {

    const y = pad.t+ph*i/4;
    const v = ymax-(ymax-ymin)*i/4;

    ctx.beginPath();
    ctx.moveTo(pad.l,y);
    ctx.lineTo(pad.l+pw,y);
    ctx.stroke();

    ctx.fillText(v.toFixed(2),5,y+4);
  }

  // 零轴
  if (ymin<=0 && ymax>=0) {

    ctx.strokeStyle = "#48627c";
    ctx.setLineDash([4,5]);

    ctx.beginPath();
    ctx.moveTo(pad.l,Y(0));
    ctx.lineTo(pad.l+pw,Y(0));
    ctx.stroke();

    ctx.setLineDash([]);
  }

  // 函数曲线
  ctx.save();

  ctx.beginPath();
  ctx.rect(pad.l,pad.t,pw,ph);
  ctx.clip();

  ctx.strokeStyle = "#58dced";
  ctx.lineWidth = 2.2;
  ctx.shadowColor = "#58dced";
  ctx.shadowBlur = 8;

  ctx.beginPath();

  let pen = false;

  for (let i=0;i<=1600;i++) {

    const x = end*i/1600;
    const v = valueAt(fn,x);

    if (!Number.isFinite(v) || Math.abs(v)>1e8) {
      pen = false;
      continue;
    }

    if (!pen) {
      ctx.moveTo(X(x),Y(v));
      pen = true;
    } else {
      ctx.lineTo(X(x),Y(v));
    }
  }

  ctx.stroke();

  // 播放进度线
  if (isPitch && playing) {

    const x = clamp(elapsed,0,T);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#ffca75";
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(X(x),pad.t);
    ctx.lineTo(X(x),pad.t+ph);
    ctx.stroke();
  }

  ctx.restore();

  $("axisX").textContent = isPitch
    ? "横轴：时间 t（秒）"
    : "横轴：相位 φ（弧度）";

  $("axisY").textContent = isPitch
    ? "纵轴：音高 y（半音）"
    : "纵轴：波形振幅";

  $("graphNote").textContent = isPitch
    ? "音调函数的横轴范围为 0 至 T，纵轴表示相对中央 C 的半音数。"
    : "音色函数展示一个完整周期（0 至 2π）的波形。";
}


/* ==========================
   音色函数 → 周期波形
========================== */

// 对自定义音色函数进行傅里叶分解。
// Web Audio API 使用傅里叶系数合成周期波形。

function buildPeriodicWave() {

  const harmonics = 64;
  const samples = 2048;

  const real = new Float32Array(harmonics+1);
  const imag = new Float32Array(harmonics+1);

  const values = new Float64Array(samples);

  let mean = 0;

  // 采样一个周期
  for (let i=0;i<samples;i++) {

    const phi = TAU*i/samples;
    const v = valueAt(timbreFn,phi);

    if (!Number.isFinite(v) || Math.abs(v)>1e6) {
      throw Error("音色函数产生了无效波形。");
    }

    values[i] = v;
    mean += v;
  }

  mean /= samples;

  // 计算傅里叶系数
  for (let n=1;n<=harmonics;n++) {

    let a = 0;
    let b = 0;

    for (let i=0;i<samples;i++) {

      const phi = TAU*i/samples;
      const v = values[i]-mean;

      a += v*Math.cos(n*phi);
      b += v*Math.sin(n*phi);
    }

    real[n] = 2*a/samples;
    imag[n] = 2*b/samples;
  }

  return audio.createPeriodicWave(
    real,
    imag,
    {disableNormalization:false}
  );
}


/* ==========================
   应用函数
========================== */

function apply() {

  try {

    const nextPitch = compileExpression(
      pitchInput.value,
      "t"
    );

    const nextTimbre = compileExpression(
      timbreInput.value,
      "phi"
    );

    // 检查音色函数整个周期
    for (let i=0;i<128;i++) {

      const v = valueAt(nextTimbre,TAU*i/128);

      if (!Number.isFinite(v) || Math.abs(v)>1e6) {
        throw Error("音色函数在一个周期内出现无效值。");
      }
    }

    pitchFn = nextPitch;
    timbreFn = nextTimbre;

    if (osc && audio) {
      osc.setPeriodicWave(buildPeriodicWave());
    }

    draw();

    say("两个函数已成功应用。");

    return true;

  } catch(e) {

    say(e.message,true);

    return false;
  }
}


/* ==========================
   音高显示
========================== */

function noteName(semi) {

  const n = Math.round(semi);

  const names = [
    "C","C♯","D","D♯","E","F",
    "F♯","G","G♯","A","A♯","B"
  ];

  const midi = 60+n;

  return names[((midi%12)+12)%12]
    +(Math.floor(midi/12)-1)
    +" · "+(n>=0?"+":"")+n;
}


function updateReadout() {

  $("timeRead").textContent = elapsed.toFixed(2)+" s";

  const v = valueAt(pitchFn,elapsed);

  $("pitchRead").textContent =
    Number.isFinite(v) ? noteName(v) : "—";
}


/* ==========================
   音频系统
========================== */

async function ensureAudio() {

  if (!audio) {

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AC) {
      throw Error("当前浏览器不支持 Web Audio API。");
    }

    audio = new AC();
  }

  if (audio.state==="suspended") {
    await audio.resume();
  }
}


// 音高转换为频率
// 中央 C4 = 261.625565 Hz

function frequencyAt(t) {

  const y = valueAt(pitchFn,t);

  if (!Number.isFinite(y)) return 0;

  return 261.625565 *
    Math.pow(2,clamp(y,-96,96)/12);
}


// 淡出，避免突然停止产生爆音
function fadeOut() {

  if (gain && audio) {

    const now = audio.currentTime;

    gain.gain.cancelScheduledValues(now);

    gain.gain.setTargetAtTime(
      0.0001,
      now,
      0.015
    );
  }
}


/* ==========================
   播放
========================== */

async function play() {

  if (playing) return;

  try {

    const nextT = Number(durationInput.value);

    if (!Number.isFinite(nextT) || nextT<0.1 || nextT>600) {
      throw Error("T 必须在 0.1 到 600 秒之间。");
    }

    T = nextT;

    if (!apply()) return;

    await ensureAudio();

    if (elapsed>=T) elapsed=0;

    if (!osc) {

      osc = audio.createOscillator();
      gain = audio.createGain();

      osc.setPeriodicWave(buildPeriodicWave());

      gain.gain.value = 0.0001;

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start();

    } else {

      osc.setPeriodicWave(buildPeriodicWave());
    }

    const now = audio.currentTime;

    osc.frequency.cancelScheduledValues(now);

    osc.frequency.setValueAtTime(
      Math.max(1,frequencyAt(elapsed)),
      now
    );

    gain.gain.cancelScheduledValues(now);

    gain.gain.setTargetAtTime(
      0.16,
      now,
      0.025
    );

    startAt = performance.now()-elapsed*1000;

    playing = true;

    $("play").disabled = true;
    $("pause").disabled = false;
    $("stop").disabled = false;

    setState("播放中",true);

    say("正在播放乐段。");

    tick();

  } catch(e) {

    say(e.message,true);
  }
}


/* ==========================
   播放循环
========================== */

function tick() {

  if (!playing) return;

  elapsed = (performance.now()-startAt)/1000;

  if (elapsed>=T) {

    elapsed=T;
    finish();
    return;
  }

  const f = frequencyAt(elapsed);

  if (osc && audio && Number.isFinite(f)) {

    const now = audio.currentTime;

    osc.frequency.cancelScheduledValues(now);

    osc.frequency.setTargetAtTime(
      Math.max(1,f),
      now,
      0.012
    );
  }

  updateReadout();
  draw();

  raf = requestAnimationFrame(tick);
}


/* ==========================
   暂停、停止、结束
========================== */

function finish() {

  playing = false;

  cancelAnimationFrame(raf);

  fadeOut();

  $("play").disabled = false;
  $("pause").disabled = true;
  $("stop").disabled = false;

  setState("已播放完毕");

  updateReadout();
  draw();

  say("乐段播放完毕。");
}


function pause() {

  if (!playing) return;

  elapsed = clamp(
    (performance.now()-startAt)/1000,
    0,
    T
  );

  playing = false;

  cancelAnimationFrame(raf);

  fadeOut();

  $("play").disabled = false;
  $("pause").disabled = true;

  setState("已暂停");

  updateReadout();
  draw();

  say("已暂停，可以继续播放。");
}


function stop() {

  playing = false;

  cancelAnimationFrame(raf);

  elapsed = 0;

  fadeOut();

  $("play").disabled = false;
  $("pause").disabled = true;
  $("stop").disabled = true;

  setState("待机");

  updateReadout();
  draw();

  say("已停止。");
}


/* ==========================
   图像切换
========================== */

function switchGraph(which) {

  activeGraph = which;

  $("pitchTab").classList.toggle(
    "active",
    which==="pitch"
  );

  $("timbreTab").classList.toggle(
    "active",
    which==="timbre"
  );

  draw();
}


/* ==========================
   事件绑定
========================== */

$("apply").addEventListener("click",apply);

$("play").addEventListener("click",play);
$("pause").addEventListener("click",pause);
$("stop").addEventListener("click",stop);

$("pitchTab").addEventListener(
  "click",
  ()=>switchGraph("pitch")
);

$("timbreTab").addEventListener(
  "click",
  ()=>switchGraph("timbre")
);


// 调整乐段长度
durationInput.addEventListener("change",()=>{

  const n = Number(durationInput.value);

  if (Number.isFinite(n) && n>=0.1 && n<=600) {

    T = n;
    elapsed = clamp(elapsed,0,T);

    draw();
    updateReadout();

    say("乐段长度已更新为 "+T+" 秒。");

  } else {

    say("T 必须在 0.1 到 600 秒之间。",true);
  }
});


// 预设函数按钮
document.querySelectorAll(".chip").forEach(button=>{

  button.addEventListener("click",()=>{

    if (button.dataset.target==="pitch") {

      pitchInput.value = button.dataset.f;

    } else {

      timbreInput.value = button.dataset.f;
    }

    apply();
  });
});


// 回车应用函数
pitchInput.addEventListener("keydown",e=>{
  if (e.key==="Enter") apply();
});

timbreInput.addEventListener("keydown",e=>{
  if (e.key==="Enter") apply();
});

window.addEventListener("resize",resize);


// 初始化
resize();
updateReadout();

})();
</script>
</body>
</html>
